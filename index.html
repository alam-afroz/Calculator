<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="screen">
      <h1>Calculator</h1>
      <p>
        <label for="theme">Change Theme </label>
        <select name="theme" id="theme">
          <option value="">Default</option>
          <option value="icy_grey">Icy Grey</option>
          <option value="mud_pink">MudPink</option>
          <option value="dark_mode">Dark Mode</option>
          <option value="playful_grid">Playful Grid</option>
          <option value="soft_flow">Soft Flow</option>
          <option value="nature_space">Nature Space</option>
          <option value="quite_orange">Quite Orange</option>
          <option value="blush_blush">Blush Blush</option>
          <option value="purple_page">Purple Page</option>
          <option value="classic_dark">Classic Dark</option>
          <option value="working_line">Working Line</option>
          <option value="joy_time">Joy Time</option>
        </select>
      </p>
      <div class="calc">
        <div class="display"></div>
        <div class="taskButton">
          <button class="clear">CLR</button>
          <button class="delete">DEL</button>
        </div>
        <div class="mathButton">
          <div class="operator">
            <button class="plus numbtn">+</button>
            <button class="minus numbtn">-</button>
            <button class="multiply numbtn">*</button>
            <button class="dividebtn numbtn">/</button>
          </div>
          <div class="col1">
            <button class="numbtn" id="zero">0</button>
            <button class="numbtn" id="one">1</button>
            <button class="numbtn" id="two">2</button>

            <button class="equal">=</button>
          </div>
          <div class="col2">
            <button class="numbtn" id="three">3</button>
            <button class="numbtn" id="four">4</button>

            <button class="numbtn" id="five">5</button>
            <button class="numbtn" id="six">6</button>
          </div>
          <div class="col3">
            <button class="numbtn" id="seven">7</button>
            <button class="numbtn" id="eight">8</button>
            <button class="numbtn" id="nine">9</button>
            <button class="numbtn" id="decimal">&#8226;</button>
          </div>
        </div>
      </div>
      <span style="color: rgba(0, 0, 0, 0.44)">
        Alert :DEL button doesn't work yet</span
      >
    </div>
    <script src="calcualtor.js"></script>
  </body>
</html>
