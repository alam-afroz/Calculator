<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="calc">
        <div class="display">0</div>
        <div class="btn">
          <div class="numbers">
            <button class="numbtn" id="zero">0</button>
            <button class="numbtn" id="one">1</button>
            <button class="numbtn" id="two">2</button>
            <button class="numbtn" id="three">3</button>
            <button class="numbtn" id="four">4</button>
            <button class="numbtn" id="five">5</button>
            <button class="numbtn" id="six">6</button>
            <button class="numbtn" id="seven">7</button>
            <button class="numbtn" id="eight">8</button>
            <button class="numbtn" id="nine">9</button>
            <button class="numbtn" id="decimal">.</button>
          </div>
          <div class="operator">
            <button class="plus">+</button>
            <button class="minus">-</button>
            <button class="multiply">*</button>
            <button class="dividebtn">/</button>
          </div>
          <div class="equal">
            <button>=</button>
          </div>
          <button class="clear">CLR</button>
        </div>
      </div>
    </div>
    <script src="calcualtor.js"></script>
  </body>
</html>
